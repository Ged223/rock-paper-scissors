<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="buttons">
        <button id="rockButton">Rock</button>
        <button id="paperButton">Paper</button>
        <button id="scissorsButton">Scissors</button>
    </div>
    <section>
        <div id="message">Welcome to the game of Rock, Paper, Scissors!
            Click a button to make your choice.
        </div>
        <p id="scoreHuman">Human: 0</p>
        <p id="scoreComputer">Computer: 0</p>
        <p id="overMessage">-</p>
    </section>


</body>

</html>
